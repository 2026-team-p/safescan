id: safescan-dir-listing
info:
  name: 디렉터리 리스팅 노출
  author: safescan
  severity: medium
  description: /files/ 경로에서 디렉터리 목록이 그대로 노출됩니다.
  remediation: 웹 서버의 디렉터리 리스팅(autoindex)을 끄고 공개할 필요가 없는 파일을 제거하세요.
  classification:
    cwe-id: CWE-548
  tags: exposure,misconfig,listing
http:
  - method: GET
    path:
      - "{{BaseURL}}/files/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "Index of /"
