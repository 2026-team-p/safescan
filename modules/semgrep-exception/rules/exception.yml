rules:
  # ───────── JavaScript / TypeScript ─────────
  - id: safescan.exc.js.empty-catch
    languages: [javascript, typescript]
    severity: INFO
    message: catch 블록이 비어 있어 오류가 조용히 사라집니다. 최소한 로그를 남기거나 호출한 쪽으로 다시 던지세요.
    metadata:
      cwe: ["CWE-390"]
      owasp: ["A10:2025"]
      confidence: HIGH
    pattern-either:
      - pattern: |
          try { ... } catch ($E) {}
      - pattern: |
          try { ... } catch {}

  - id: safescan.exc.js.stack-trace-exposure
    languages: [javascript, typescript]
    severity: WARNING
    message: 오류의 스택 트레이스를 클라이언트 응답으로 내보냅니다. 내부 구조가 노출되므로 서버에만 기록하고 응답에는 일반 메시지만 쓰세요.
    metadata:
      cwe: ["CWE-209"]
      owasp: ["A10:2025"]
      confidence: HIGH
    patterns:
      - pattern: $RES.$M(<... $E.stack ...>)
      - metavariable-regex:
          metavariable: $M
          regex: ^(send|json|end|write|render)$

  - id: safescan.exc.js.fail-open
    languages: [javascript, typescript]
    severity: ERROR
    message: 인증 · 검증 함수가 예외가 나면 true 를 돌려줍니다(fail-open). 오류 시에는 거부(false)하거나 예외를 다시 던지세요.
    metadata:
      cwe: ["CWE-636"]
      owasp: ["A10:2025"]
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          function $F(...) { ... }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(auth|verify|valid|permi|allow|check|login|token).*
      - pattern: |
          try { ... } catch ($E) { ... return true; }

  # ───────── Python ─────────
  - id: safescan.exc.python.empty-except
    languages: [python]
    severity: INFO
    message: except 블록이 pass 만 하고 있어 오류가 조용히 사라집니다. 로그를 남기거나 다시 raise 하세요.
    metadata:
      cwe: ["CWE-390"]
      owasp: ["A10:2025"]
      confidence: HIGH
    pattern-either:
      - pattern: |
          try:
              ...
          except:
              pass
      - pattern: |
          try:
              ...
          except $E:
              pass

  - id: safescan.exc.python.stack-trace-exposure
    languages: [python]
    severity: WARNING
    message: traceback 을 응답으로 돌려줍니다. 내부 구조가 노출되므로 서버 로그에만 남기고 응답에는 일반 메시지만 쓰세요.
    metadata:
      cwe: ["CWE-209"]
      owasp: ["A10:2025"]
      confidence: HIGH
    pattern-either:
      - pattern: return <... traceback.format_exc() ...>
      - pattern: return <... traceback.format_exception(...) ...>

  - id: safescan.exc.python.fail-open
    languages: [python]
    severity: ERROR
    message: 인증 · 검증 함수가 예외가 나면 True 를 돌려줍니다(fail-open). 오류 시에는 거부(False)하거나 다시 raise 하세요.
    metadata:
      cwe: ["CWE-636"]
      owasp: ["A10:2025"]
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          def $F(...):
              ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(auth|verify|valid|permi|allow|check|login|token).*
      - pattern: |
          try:
              ...
          except $E:
              ...
              return True

  # ───────── Java ─────────
  - id: safescan.exc.java.empty-catch
    languages: [java]
    severity: INFO
    message: catch 블록이 비어 있어 예외가 조용히 사라집니다. 로그를 남기거나 다시 던지세요.
    metadata:
      cwe: ["CWE-390"]
      owasp: ["A10:2025"]
      confidence: HIGH
    pattern: |
      try { ... } catch ($T $E) {}

  - id: safescan.exc.java.print-stack-trace
    languages: [java]
    severity: INFO
    message: printStackTrace() 는 표준 오류로 스택을 내보내 로그 체계를 우회합니다. 로거(logger.error)를 사용하세요.
    metadata:
      cwe: ["CWE-209"]
      owasp: ["A10:2025"]
      confidence: HIGH
    pattern: $E.printStackTrace()

  - id: safescan.exc.java.fail-open
    languages: [java]
    severity: ERROR
    message: 인증 · 검증 메서드가 예외가 나면 true 를 돌려줍니다(fail-open). 오류 시에는 거부(false)하거나 예외를 다시 던지세요.
    metadata:
      cwe: ["CWE-636"]
      owasp: ["A10:2025"]
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          $RET $F(...) { ... }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(auth|verify|valid|permi|allow|check|login|token).*
      - pattern: |
          try { ... } catch ($T $E) { ... return true; }
